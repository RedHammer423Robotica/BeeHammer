<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bee Hammer</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#e6dfd2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2a2118;overflow:hidden}
  body{display:flex;flex-direction:column}
  button{font:inherit;font-size:13px;padding:7px 11px;border:1px solid #b6a88f;background:#faf6ee;color:#2a2118;border-radius:6px;cursor:pointer}
  button:hover{background:#fff}
  button.on{background:#3b2a18;color:#fff;border-color:#3b2a18}
  button:focus-visible,.dl:focus-visible{outline:2px solid #3b2a18;outline-offset:2px}

  #topbar{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 10px 0;background:#f6f1e7;border-bottom:1px solid #cdbfa6}
  .tabs{display:flex;gap:4px}
  .tab{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 12px;font-size:14px;font-weight:600;color:#5b4c3a}
  .tab:hover{background:transparent;color:#2a2118}
  .tab.on{background:transparent;color:#2a2118;border-bottom-color:#3b2a18}
  #lang{display:flex;margin-bottom:6px}
  #lang button{padding:5px 10px;font-size:12px;font-weight:700;border-radius:0}
  #lang button:first-child{border-radius:6px 0 0 6px}
  #lang button:last-child{border-radius:0 6px 6px 0;border-left:0}

  #viewer{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #viewer[hidden],#download[hidden],#about[hidden]{display:none}
  #stage{position:relative;flex:1 1 50%;min-height:0}
  #c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #info{position:absolute;left:10px;top:8px;pointer-events:none}
  h1{font-size:17px;font-weight:700}
  .sub{font-size:11.5px;color:#5b4c3a;margin-top:2px;line-height:1.4}
  #side{flex:1 1 50%;min-height:0;display:flex;flex-direction:column;background:#f6f1e7;border-top:1px solid #cdbfa6}
  #bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;justify-content:center}
  #tech{position:relative;flex:1 1 auto;min-height:0;background:#fff;margin:0 8px 8px;border:1px solid #cdbfa6;border-radius:6px}
  #techInner{position:absolute;inset:4px}
  #techInner svg{width:100%;height:100%;display:block}
  @media (orientation:landscape) and (min-width:700px){
    #viewer{flex-direction:row}
    #stage{flex:1 1 58%}
    #side{flex:0 0 42%;border-top:0;border-left:1px solid #cdbfa6}
  }

  #download,#about{flex:1 1 auto;overflow:auto;padding:24px 16px;background:#f6f1e7}
  .card{max-width:520px;margin:0 auto;background:#fff;border:1px solid #cdbfa6;border-radius:10px;padding:22px}
  .card h2{font-size:19px;margin-bottom:8px}
  .card p{font-size:14px;line-height:1.55;color:#5b4c3a;margin-bottom:16px}
  .dl{display:inline-block;font-size:15px;font-weight:600;padding:11px 18px;border-radius:8px;background:#3b2a18;color:#fff;text-decoration:none}
  .dl.off{background:#d6cdbd;color:#7a6c58;cursor:not-allowed;pointer-events:none}
  .note{margin:12px 0 0;font-size:13px;color:#7a6c58}
  #about .card{max-width:760px}
  #about figure{margin:0 0 18px;text-align:center}
  #about figure img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:8px;border:1px solid #cdbfa6}
  #about figcaption{margin-top:6px;font-size:12.5px;color:#7a6c58}
  #about h3{font-size:16px;margin:18px 0 8px}
  #about ul{margin:0 0 4px;padding-left:20px}
  #about li{font-size:14px;line-height:1.55;color:#5b4c3a;margin-bottom:8px}
  #about strong{color:#2a2118}
  #cc{flex:0 0 auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#f6f1e7;border-top:1px solid #cdbfa6;text-align:center;font-size:11.5px;line-height:1.5;color:#5b4c3a}
  #cc a{color:#3b2a18}
  #cc img{vertical-align:text-bottom}
</style>
</head>
<body>
<div id="topbar">
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="viewer" role="tab" data-i="tab_viewer"></button>
    <button class="tab" data-tab="about" role="tab" data-i="tab_about"></button>
    <button class="tab" data-tab="download" role="tab" data-i="tab_dl"></button>
  </div>
  <div id="lang" role="group" aria-label="Idioma / Language">
    <button data-lang="pt" class="on" aria-pressed="true">PT</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<main id="viewer">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="info"><h1>Bee Hammer</h1><div class="sub" data-i="sub"></div></div>
  </div>
  <div id="side">
    <div id="bar">
      <button data-v="iso" class="on" data-i="iso"></button>
      <button data-v="front" data-i="front"></button>
      <button data-v="back" data-i="back"></button>
      <button data-v="right" data-i="right"></button>
      <button data-v="left" data-i="left"></button>
      <button data-v="top" data-i="top"></button>
      <button data-v="cut" data-i="cut"></button>
      <button id="spin" data-i="spin"></button>
      <button id="ghost" data-i="ghost"></button>
    </div>
    <div id="tech"><div id="techInner"></div></div>
  </div>
</main>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function coirTexture(){
  const S=512,cv=document.createElement('canvas');cv.width=cv.height=S;
  const g=cv.getContext('2d'),r=rng(11);
  g.fillStyle='#2a1a10';g.fillRect(0,0,S,S);
  const soil=['#3a2414','#4a2f1a','#1f130b','#5a3a20','#352112'];
  for(let i=0;i<3500;i++){g.fillStyle=soil[(r()*soil.length)|0];const s=1+r()*3;g.fillRect(r()*S,r()*S,s,s);}
  const fib=['#c79a5a','#b58446','#d9b377','#9a6c36','#e0c28c'];
  g.lineCap='round';
  for(let i=0;i<2400;i++){
    const x=r()*S,y=r()*S,a=r()*Math.PI*2,len=14+r()*46,bend=(r()-.5)*30;
    g.strokeStyle=fib[(r()*fib.length)|0];g.globalAlpha=.55+r()*.4;g.lineWidth=.8+r()*1.1;
    for(const dx of[-S,0,S])for(const dy of[-S,0,S]){
      g.beginPath();g.moveTo(x+dx,y+dy);
      g.quadraticCurveTo(x+dx+Math.cos(a)*len/2-Math.sin(a)*bend,y+dy+Math.sin(a)*len/2+Math.cos(a)*bend,x+dx+Math.cos(a)*len,y+dy+Math.sin(a)*len);
      g.stroke();
    }
  }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(0.14,0.14);t.anisotropy=4;return t;
}

const outerMats=[0x8f9b4c,0xa3a45a,0xc2b274,0x7d8a45,0xb8a866].map(c=>reg(new THREE.MeshStandardMaterial({color:c,roughness:.55,side:THREE.DoubleSide})));

function makeTube(ro,ri,z0,z1,outerMat){
  const g=new THREE.Group(),len=z1-z0,zc=(z0+z1)/2;
  const o=new THREE.Mesh(new THREE.CylinderGeometry(ro,ro,len,20,1,true),outerMat);
  const i=new THREE.Mesh(new THREE.CylinderGeometry(ri,ri,len,20,1,true),innerMat);
  o.rotation.x=i.rotation.x=Math.PI/2; o.position.z=i.position.z=zc;
  const cap=new THREE.Mesh(new THREE.RingGeometry(ri,ro,20),capMat); cap.position.z=z1;
  g.add(o,i,cap); return g;
}
const rand=rng(7), placed=[];
function fits(x,y,r){
  for(let k=0;k<6;k++){const a=k*Math.PI/3+Math.PI/6;if(x*Math.cos(a)+y*Math.sin(a)+r>A-T-0.04)return false;}
  return true;
}
for(const [rmax,rmin] of [[1.3,1.0],[1.0,0.8],[0.8,0.55]]){
  for(let n=0;n<3000;n++){
    const r=rmin+(rmax-rmin)*rand(), x=(rand()*2-1)*Ri, y=(rand()*2-1)*A;
    if(!fits(x,y,r))continue;
    if(placed.some(p=>Math.hypot(p.x-x,p.y-y)<p.r+r+0.07))continue;
    placed.push({x,y,r});
  }
}
placed.forEach(p=>{
  const z0=ZWALL+T/2, zEnd=LLOW+(rand()*1.8-0.4);
  const ri=Math.max(0.25,p.r-0.3);
  const t=makeTube(p.r,ri,z0,zEnd,outerMats[(rand()*outerMats.length)|0]);
  t.position.set(p.x,p.y,0); body.add(t);
  if(rand()<0.3){
    const plug=new THREE.Mesh(new THREE.CircleGeometry(ri,16),plugMat);
    plug.position.set(p.x,p.y,zEnd-0.3-rand()*0.8); body.add(plug);
  }
});

function setLang(l){
  lang=l; document.documentElement.lang=(l==='pt')?'pt-BR':'en'; document.title=I18N[l].title;
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=I18N[l][e.dataset.i];});
  document.getElementById('aboutImg').alt=I18N[l].about_cap;
  document.querySelectorAll('[data-lang]').forEach(b=>{const on=b.dataset.lang===l;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  techBox.innerHTML=TECH[l][techKey];
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

const viewerEl=document.getElementById('viewer'), aboutEl=document.getElementById('about'), downloadEl=document.getElementById('download');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  viewerEl.hidden=(t!=='viewer'); aboutEl.hidden=(t!=='about'); downloadEl.hidden=(t!=='download'); paused=(t!=='viewer');
  if(!paused) resize();
});

const dlBtn=document.getElementById('dl');
(function(){
  const url=(DOWNLOAD_URL||'').trim(), ok=url!=='';
  if(ok){dlBtn.href=url;dlBtn.setAttribute('download',DOWNLOAD_FILENAME);dlBtn.target='_blank';dlBtn.rel='noopener';dlBtn.classList.remove('off');}
  else{dlBtn.removeAttribute('href');dlBtn.setAttribute('aria-disabled','true');}
  document.getElementById('dlnote').hidden=ok;
})();
setLang('pt');

const ptrs=new Map();let lastPinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});});
canvas.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);lastPinch=0;});
canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);lastPinch=0;});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  if(ptrs.size===1){
    goal.th-=(e.clientX-p.x)*0.008; goal.ph=Math.min(Math.PI-0.04,Math.max(0.04,goal.ph-(e.clientY-p.y)*0.008));
    st.th=goal.th;st.ph=goal.ph; setActive(null);
  }
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastPinch){goal.r=Math.min(140,Math.max(18,goal.r*lastPinch/d));st.r=goal.r;} lastPinch=d;}
});
canvas.addEventListener('wheel',e=>{e.preventDefault();goal.r=Math.min(140,Math.max(18,goal.r*(1+e.deltaY*0.001)));st.r=goal.r;},{passive:false});

function loop(){
  requestAnimationFrame(loop);
  if(spin){goal.th+=0.006;st.th=goal.th;}
  else{
    let d=goal.th-st.th; d=Math.atan2(Math.sin(d),Math.cos(d));
    st.th+=d*0.12; st.ph+=(goal.ph-st.ph)*0.12; st.r+=(goal.r-st.r)*0.12;
  }
  if(!paused){place(); renderer.render(scene,camera);}
}
loop();
</script>
